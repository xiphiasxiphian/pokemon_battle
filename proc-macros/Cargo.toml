[package]
name = "proc-macros"
version = "0.1.0"
edition = "2024"

[lib]
proc-macro = true

[dependencies]
heck = "0.5.0"
jwalk = "0.9.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
rayon = "1.12.0"
serde = { version = "1.0.229", features = ["derive"] }
syn = { version = "3.0.5", features = ["full"] }
toml = "1.1.5"
